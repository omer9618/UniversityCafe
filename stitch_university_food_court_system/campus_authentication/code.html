<!DOCTYPE html>

<html lang="en"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0" name="viewport"/><meta content="web_blank" name="shell-type"/><link href="https://fonts.googleapis.com" rel="preconnect"/><link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600&amp;family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&amp;family=Space+Mono:ital,wght@0,400;0,700;1,400&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/><style>@layer base { html, body { margin: 0; padding: 0; } body { overscroll-behavior: none; } main > :first-child { margin-top: 0 !important; } main > :last-child { margin-bottom: 0 !important; } } ::-webkit-scrollbar { display: none; }</style><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { "colors": { "surface": "#fdf8f6", "on-secondary-fixed-variant": "#4b4640", "tertiary-container": "#777471", "surface-container-high": "#ece7e5", "outline-variant": "#ddc0ba", "on-secondary-fixed": "#1e1b16", "secondary-fixed-dim": "#cdc5be", "primary": "#9d3d26", "error-container": "#ffdad6", "tertiary-fixed": "#e6e2de", "on-surface": "#1c1b1a", "primary-fixed": "#ffdad2", "secondary-container": "#e6ded6", "surface-dim": "#ddd9d7", "surface-tint": "#a04028", "secondary-fixed": "#e9e1d9", "on-background": "#1c1b1a", "on-primary-fixed": "#3c0700", "background": "#fdf8f6", "error": "#ba1a1a", "on-primary": "#ffffff", "on-secondary": "#ffffff", "surface-variant": "#e6e2df", "surface-container-highest": "#e6e2df", "inverse-primary": "#ffb4a2", "surface-container-low": "#f7f3f0", "surface-bright": "#fdf8f6", "on-error": "#ffffff", "inverse-on-surface": "#f4f0ee", "inverse-surface": "#31302f", "surface-container": "#f1edeb", "tertiary-fixed-dim": "#cac6c2", "primary-container": "#bd553b", "on-primary-fixed-variant": "#802913", "on-surface-variant": "#56423d", "surface-container-lowest": "#ffffff", "on-tertiary-fixed-variant": "#484644", "primary-fixed-dim": "#ffb4a2", "on-secondary-container": "#67625b", "tertiary": "#5e5c59", "on-tertiary": "#ffffff", "on-primary-container": "#fffbff", "on-tertiary-fixed": "#1d1b19", "on-error-container": "#93000a", "secondary": "#635e57", "outline": "#8a726c", "on-tertiary-container": "#fffbff" }, "borderRadius": { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, "spacing": { "space-md": "1rem", "space-xl": "2.5rem", "gutter-mobile": "1rem", "space-sm": "0.5rem", "margin": "3rem", "gutter": "1.5rem", "space-lg": "1.5rem", "margin-mobile": "1.25rem", "space-xs": "0.25rem" }, "fontFamily": { "headline-md": [ "Newsreader" ], "headline-xl-mobile": [ "Newsreader" ], "label-sm": [ "Space Mono" ], "headline-lg-mobile": [ "Newsreader" ], "body-sm": [ "Manrope" ], "label-lg": [ "Space Mono" ], "headline-sm": [ "Newsreader" ], "label-md": [ "Space Mono" ], "body-lg": [ "Manrope" ], "body-md": [ "Manrope" ], "headline-xl": [ "Newsreader" ], "headline-lg": [ "Newsreader" ] }, "fontSize": { "headline-md": [ "1.5rem", { "lineHeight": "2rem", "letterSpacing": "-0.01em", "fontWeight": "400" } ], "headline-xl-mobile": [ "2.25rem", { "lineHeight": "2.75rem", "letterSpacing": "-0.02em", "fontWeight": "400" } ], "label-sm": [ "0.6875rem", { "lineHeight": "0.875rem", "letterSpacing": "0.1em", "fontWeight": "400" } ], "headline-lg-mobile": [ "1.75rem", { "lineHeight": "2.25rem", "letterSpacing": "-0.01em", "fontWeight": "400" } ], "body-sm": [ "0.8125rem", { "lineHeight": "1.25rem", "fontWeight": "400" } ], "label-lg": [ "0.875rem", { "lineHeight": "1.25rem", "letterSpacing": "0.06em", "fontWeight": "400" } ], "headline-sm": [ "1.25rem", { "lineHeight": "1.75rem", "fontWeight": "500" } ], "label-md": [ "0.75rem", { "lineHeight": "1rem", "letterSpacing": "0.08em", "fontWeight": "400" } ], "body-lg": [ "1.125rem", { "lineHeight": "1.75rem", "fontWeight": "400" } ], "body-md": [ "0.9375rem", { "lineHeight": "1.5rem", "fontWeight": "400" } ], "headline-xl": [ "3rem", { "lineHeight": "3.5rem", "letterSpacing": "-0.02em", "fontWeight": "400" } ], "headline-lg": [ "2.25rem", { "lineHeight": "2.75rem", "letterSpacing": "-0.015em", "fontWeight": "400" } ] } } } };</script></head><body class="bg-surface font-body-md text-body-md text-on-surface antialiased min-h-screen flex items-center justify-center p-gutter-mobile"><main class="w-full max-w-md"><div class="flex flex-col w-full">
<div class="relative w-full bg-surface-container-lowest rounded-xl shadow-xl p-8 sm:p-10 flex flex-col gap-6 overflow-hidden">
<div class="absolute -top-12 -right-12 w-36 h-36 rounded-full bg-primary/5 pointer-events-none blur-xl"></div>
<div class="absolute -bottom-10 -left-10 w-28 h-28 rounded-full bg-primary-fixed/30 pointer-events-none blur-lg"></div>
<div class="flex items-center justify-between">
<span class="font-label-sm text-label-sm uppercase tracking-widest text-primary font-medium bg-surface-container-low px-2.5 py-1 rounded">
        terminal 07 • gate 2
      </span>
<span class="font-label-sm text-label-sm text-secondary">
        sys.v2.4
      </span>
</div>
<div class="flex flex-col gap-2">
<div class="flex items-baseline gap-1">
<h1 class="font-headline-lg text-headline-lg text-on-surface lowercase tracking-tight">
          campus food court
        </h1>
<span class="font-headline-lg text-headline-lg text-primary select-none">*</span>
</div>
<p class="font-body-sm text-body-sm text-on-surface-variant leading-relaxed">
        Sign in with your university credentials to order meals or manage stalls.
      </p>
</div>
<div class="flex items-center gap-6 text-body-md pt-1">
<button class="font-body-md text-on-surface font-semibold relative pb-1.5 transition-colors focus:outline-none" id="role-student" onclick="setRole('student')" type="button">
        Student
        <span class="absolute bottom-0 left-0 w-full h-[2px] bg-primary rounded-full transition-all" id="indicator-student"></span>
</button>
<span class="text-outline-variant font-label-sm select-none">|</span>
<button class="font-body-md text-secondary hover:text-on-surface relative pb-1.5 transition-colors focus:outline-none" id="role-vendor" onclick="setRole('vendor')" type="button">
        Vendor
        <span class="absolute bottom-0 left-0 w-full h-[2px] bg-primary rounded-full transition-all opacity-0" id="indicator-vendor"></span>
</button>
</div>
<div class="flex items-center justify-between bg-surface-container-low p-1 rounded-lg">
<button class="flex-1 py-1.5 text-center font-label-sm text-label-sm uppercase rounded bg-surface-container-lowest text-on-surface shadow-sm font-medium transition-all" id="tab-signin" onclick="setMode('signin')" type="button">
        Sign In
      </button>
<button class="flex-1 py-1.5 text-center font-label-sm text-label-sm uppercase rounded text-secondary hover:text-on-surface transition-all" id="tab-register" onclick="setMode('register')" type="button">
        Register
      </button>
</div>
<form class="flex flex-col gap-4 mt-1" onsubmit="event.preventDefault(); handleAuth();">
<div class="flex flex-col gap-1.5">
<label class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider" for="campus-id" id="id-label">
          Student/Campus ID
        </label>
<div class="relative flex items-center">
<input class="w-full bg-surface-container-low hover:bg-surface-container text-on-surface placeholder:text-secondary/50 placeholder:font-headline-sm placeholder:italic text-body-md px-3.5 py-2.5 rounded-lg transition-colors focus:outline-none focus:bg-surface-container-lowest focus:shadow-[0_0_0_2px_rgba(157,61,38,0.25)]" id="campus-id" placeholder="e.g. 02-134211-042" required="" type="text"/>
<span class="material-symbols-outlined text-secondary text-sm absolute right-3 pointer-events-none select-none">badge</span>
</div>
</div>
<div class="flex flex-col gap-1.5">
<label class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider" for="campus-email">
          University Email
        </label>
<div class="relative flex items-center">
<input class="w-full bg-surface-container-low hover:bg-surface-container text-on-surface placeholder:text-secondary/50 placeholder:font-headline-sm placeholder:italic text-body-md px-3.5 py-2.5 rounded-lg transition-colors focus:outline-none focus:bg-surface-container-lowest focus:shadow-[0_0_0_2px_rgba(157,61,38,0.25)]" id="campus-email" placeholder="omer.s@bahria.edu.pk" required="" type="email"/>
<span class="material-symbols-outlined text-secondary text-sm absolute right-3 pointer-events-none select-none">alternate_email</span>
</div>
</div>
<div class="flex flex-col gap-1.5">
<label class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider" for="password">
          Password
        </label>
<div class="relative flex items-center">
<input class="w-full bg-surface-container-low hover:bg-surface-container text-on-surface placeholder:text-secondary/50 text-body-md px-3.5 py-2.5 rounded-lg transition-colors focus:outline-none focus:bg-surface-container-lowest focus:shadow-[0_0_0_2px_rgba(157,61,38,0.25)] tracking-widest" id="password" placeholder="••••••••••••" required="" type="password"/>
<button aria-label="Toggle password view" class="absolute right-3 text-secondary hover:text-on-surface transition-colors p-0.5 focus:outline-none" onclick="togglePasswordVisibility()" type="button">
<span class="material-symbols-outlined text-sm select-none" id="eye-icon">visibility_off</span>
</button>
</div>
</div>
<div class="flex items-center justify-between pt-1 text-body-sm">
<label class="inline-flex items-center gap-2 cursor-pointer select-none">
<input class="w-4 h-4 rounded text-primary bg-surface-container-low accent-primary cursor-pointer focus:ring-0" id="remember-me" type="checkbox"/>
<span class="font-body-sm text-body-sm text-secondary hover:text-on-surface transition-colors">
            Remember terminal
          </span>
</label>
<a class="font-body-sm text-body-sm text-primary hover:text-primary-container transition-colors underline-offset-4 hover:underline" href="#recover">
          Forgot credentials?
        </a>
</div>
<div class="pt-2">
<button class="w-full bg-primary hover:bg-primary-container text-on-primary py-3.5 px-6 rounded-full font-label-md text-label-md uppercase tracking-wider transition-all duration-200 shadow-sm active:scale-[0.99] flex items-center justify-center gap-2" id="submit-button" type="submit">
<span>[ Enter Food Court ]</span>
<span class="material-symbols-outlined text-sm">arrow_forward</span>
</button>
</div>
</form>
<div class="pt-4 mt-2 bg-surface-container-low/70 rounded-lg p-3.5 flex items-start gap-3">
<div class="mt-0.5 w-6 h-6 rounded-full bg-surface-container-highest flex items-center justify-center flex-shrink-0">
<span class="material-symbols-outlined text-primary text-base">contactless</span>
</div>
<div class="flex flex-col gap-0.5">
<p class="font-body-sm text-body-sm text-on-surface font-medium leading-tight">
          Physical pass verification
        </p>
<p class="font-body-sm text-body-sm text-secondary leading-normal">
          Fast NFC / Student Card tap available at physical kiosk 01–04.
        </p>
</div>
</div>
</div>
<script>
    let activeRole = 'student';
    let activeMode = 'signin';

    function setRole(role) {
      activeRole = role;
      const studentBtn = document.getElementById('role-student');
      const vendorBtn = document.getElementById('role-vendor');
      const studentInd = document.getElementById('indicator-student');
      const vendorInd = document.getElementById('indicator-vendor');
      const idLabel = document.getElementById('id-label');
      const campusIdInput = document.getElementById('campus-id');

      if (role === 'student') {
        studentBtn.className = "font-body-md text-on-surface font-semibold relative pb-1.5 transition-colors focus:outline-none";
        vendorBtn.className = "font-body-md text-secondary hover:text-on-surface relative pb-1.5 transition-colors focus:outline-none";
        studentInd.classList.remove('opacity-0');
        vendorInd.classList.add('opacity-0');
        idLabel.textContent = "Student/Campus ID";
        campusIdInput.placeholder = "e.g. 02-134211-042";
      } else {
        vendorBtn.className = "font-body-md text-on-surface font-semibold relative pb-1.5 transition-colors focus:outline-none";
        studentBtn.className = "font-body-md text-secondary hover:text-on-surface relative pb-1.5 transition-colors focus:outline-none";
        vendorInd.classList.remove('opacity-0');
        studentInd.classList.add('opacity-0');
        idLabel.textContent = "Vendor Stall Code";
        campusIdInput.placeholder = "e.g. V-CHAI-09";
      }
    }

    function setMode(mode) {
      activeMode = mode;
      const signinTab = document.getElementById('tab-signin');
      const registerTab = document.getElementById('tab-register');
      const submitBtn = document.getElementById('submit-button');

      if (mode === 'signin') {
        signinTab.className = "flex-1 py-1.5 text-center font-label-sm text-label-sm uppercase rounded bg-surface-container-lowest text-on-surface shadow-sm font-medium transition-all";
        registerTab.className = "flex-1 py-1.5 text-center font-label-sm text-label-sm uppercase rounded text-secondary hover:text-on-surface transition-all";
        submitBtn.innerHTML = '<span>[ Enter Food Court ]</span><span class="material-symbols-outlined text-sm">arrow_forward</span>';
      } else {
        registerTab.className = "flex-1 py-1.5 text-center font-label-sm text-label-sm uppercase rounded bg-surface-container-lowest text-on-surface shadow-sm font-medium transition-all";
        signinTab.className = "flex-1 py-1.5 text-center font-label-sm text-label-sm uppercase rounded text-secondary hover:text-on-surface transition-all";
        submitBtn.innerHTML = '<span>[ Request Campus Account ]</span><span class="material-symbols-outlined text-sm">arrow_forward</span>';
      }
    }

    function togglePasswordVisibility() {
      const pwd = document.getElementById('password');
      const icon = document.getElementById('eye-icon');
      if (pwd.type === 'password') {
        pwd.type = 'text';
        icon.textContent = 'visibility';
      } else {
        pwd.type = 'password';
        icon.textContent = 'visibility_off';
      }
    }

    function handleAuth() {
      const submitBtn = document.getElementById('submit-button');
      const originalText = submitBtn.innerHTML;
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span class="animate-pulse">[ Authenticating... ]</span>';
      setTimeout(() => {
        submitBtn.innerHTML = '<span>[ Authenticated &bull; Welcome ]</span>';
        setTimeout(() => {
          submitBtn.disabled = false;
          submitBtn.innerHTML = originalText;
        }, 1500);
      }, 900);
    }
  </script>
</div></main></body></html>
